name: End-to-end tests (Playwright)

# Drives the admin in a real browser against wp-env's dev site. This is the
# level that catches layout breakage (a stray </div>), inline assets, and
# save flows that PHPUnit cannot see because it never renders a page.

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  e2e:
    name: E2E (chromium)
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '20'

      - name: Install npm dependencies
        run: npm install --no-audit --no-fund

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Start wp-env
        run: npx wp-env start

      - name: Activate plugin on the dev site
        run: npx wp-env run cli wp plugin activate diluxone-offload-wordpress

      - name: Run Playwright
        env:
          CI: 'true'
        run: npx playwright test

      - name: Upload traces and screenshots on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-results
          path: build/e2e-results
          retention-days: 7

      - name: Stop wp-env
        if: always()
        run: npx wp-env stop
